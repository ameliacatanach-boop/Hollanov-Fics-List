const STATUS_CODE_MAP = { '': 0, 'Read': 1, 'DNF': 2, 'Skipped': 3, 'Not Interested': 4, 'Currently Reading': 5 };

];

const CLIENT_ID = '765897251156-e328g6jmu2obg8l0855km0iqsps062n5.apps.googleusercontent.com';

function workIdFromLink(link) {
  const m = /\/works\/(\d+)/.exec(link || '');
  return m ? m[1] : (link || Math.random().toString(36));
}

const TOKEN_CACHE_KEY = 'hollanov-gtoken';

function useGoogleAuth() {
  const [accessToken, setAccessToken] = useState(null);
  const [authError, setAuthError] = useState('');
  const [gisReady, setGisReady] = useState(false);
  const tokenClientRef = useRef(null);

  const cacheToken = (token, expiresInSeconds) => {
    const expiresAt = Date.now() + (Number(expiresInSeconds) || 3600) * 1000 - 60000; // 1 min safety margin
    try { localStorage.setItem(TOKEN_CACHE_KEY, JSON.stringify({ token, expiresAt })); } catch (e) {}
  };

  useEffect(() => {
    // On load, reuse a still-valid cached token instead of forcing a fresh sign-in
    try {
      const raw = localStorage.getItem(TOKEN_CACHE_KEY);
      if (raw) {
        const { token, expiresAt } = JSON.parse(raw);
        if (token && expiresAt && Date.now() < expiresAt) setAccessToken(token);
        else localStorage.removeItem(TOKEN_CACHE_KEY);
      }
    } catch (e) {}

    let cancelled = false;
    function init() {
      if (cancelled) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
        setTimeout(init, 200);
        return;
      }
      tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SHEETS_SCOPE,
        callback: (resp) => {
          if (resp.error) { setAuthError(resp.error_description || resp.error); return; }
          setAuthError('');
          setAccessToken(resp.access_token);
          cacheToken(resp.access_token, resp.expires_in);
        },
      });
      setGisReady(true);
    }
    init();
    return () => { cancelled = true; };
  }, []);

  const signIn = () => {
    setAuthError('');
    if (tokenClientRef.current) tokenClientRef.current.requestAccessToken();
  };
  const signOut = () => {
    if (accessToken && window.google) {
      window.google.accounts.oauth2.revoke(accessToken, () => {});
    }
    localStorage.removeItem(TOKEN_CACHE_KEY);
    setAccessToken(null);
  };

  return { accessToken, gisReady, signIn, signOut, authError };
}

function ficFromRow(headerIndex, row, rowNumber) {
  const get = (name) => { const i = headerIndex[name]; return i !== undefined ? (row[i] || '') : ''; };
  const title = get('Title').trim();
  if (!title) return null;
  const link = get('Link').trim();
  const tagsRaw = get('Tags').trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  const num = (v) => { const n = parseInt(String(v).replace(/,/g, ''), 10); return isNaN(n) ? 0 : n; };

  return {
    id: workIdFromLink(link),
    rowNumber,
    title, link,
    date: get('Date Published').trim(),
    rating: get('Rating (S)').trim(),
    category: get('Category').trim() || 'Uncategorized',
    words: num(get('Words')),
    chapters: num(get('Chapters')) || 1,
    comments: num(get('Comments')),
    kudos: num(get('Kudos')),
    bookmarks: num(get('Bookmarks')),
    hits: num(get('Hits')),
    tags,
    summary: get('Summary').trim(),
    status: STATUS_CODE_MAP[get('Status').trim()] ?? 0,
    dnr: DNR_CODE_MAP[get('DNR Reason').trim()] ?? 0,
    kg: get('K').trim().toUpperCase() === 'Y',
    bk: get('B').trim().toUpperCase() === 'Y',
    syncState: 'idle', // 'idle' | 'syncing' | 'error'
    syncError: '',
  };
}

function authFetchError(status, body) {
  const err = new Error(`HTTP ${status}: ${body.slice(0, 300)}`);
  if (status === 401) err.isAuthError = true;
  return err;
}

async function sheetsApiGet(accessToken) {
  const range = encodeURIComponent(`'${SHEET_TAB}'!A1:AH`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!res.ok) {
    const body = await res.text();
    throw authFetchError(res.status, body);
  }
  const data = await res.json();
  return data.values || [];
}

async function sheetsApiWriteStatus(accessToken, rowNumber, { status, dnr, kg, bk }) {
  const range = encodeURIComponent(`'${SHEET_TAB}'!B${rowNumber}:E${rowNumber}`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?valueInputOption=USER_ENTERED`;
  const statusLabel = status === STATUS_UNREAD ? '' : STATUS_LABELS[status];
  const dnrLabel = dnr ? DNR_LABELS[dnr] : '';
  const body = { values: [[statusLabel, dnrLabel, kg ? 'Y' : '', bk ? 'Y' : '']] };
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errBody = await res.text();
    throw authFetchError(res.status, errBody);
  }
}

function useSheetFics(accessToken, onAuthError) {
  const [fics, setFics] = useState([]);
  const [status, setStatus] = useState('idle');
  const [errorMsg, setErrorMsg] = useState('');
  const [lastSynced, setLastSynced] = useState(null);

  const fetchFics = useCallback(async () => {
    if (!accessToken) return;
    setStatus('loading');
    setErrorMsg('');
    try {
      const rows = await sheetsApiGet(accessToken);
      if (rows.length < 2) throw new Error('No data found in the "Data List" tab.');
      const header = rows[0];
      const headerIndex = {};
      header.forEach((h, i) => { headerIndex[h.trim()] = i; });
      const parsedFics = [];
      for (let i = 1; i < rows.length; i++) {
        const fic = ficFromRow(headerIndex, rows[i], i + 1);
        if (fic) parsedFics.push(fic);
      }
      setFics(parsedFics);
      setLastSynced(new Date());
      setStatus('success');
    } catch (e) {
      setErrorMsg(e.message || String(e));
      setStatus('error');
      if (e.isAuthError && onAuthError) onAuthError();
    }
  }, [accessToken]);

  useEffect(() => { fetchFics(); }, [fetchFics]);

  const updateFic = useCallback(async (ficId, patch) => {
    let targetIdx = -1, prevFic = null;
    setFics(prev => {
      const idx = prev.findIndex(f => f.id === ficId);
      if (idx === -1) return prev;
      targetIdx = idx;
      prevFic = prev[idx];
      const next = [...prev];
      next[idx] = { ...prev[idx], ...patch, syncState: 'syncing', syncError: '' };
      return next;
    });
    if (targetIdx === -1) return;
    try {
      const merged = { ...prevFic, ...patch };
      await sheetsApiWriteStatus(accessToken, merged.rowNumber, merged);
      setFics(prev => {
        const next = [...prev];
        if (next[targetIdx] && next[targetIdx].id === ficId) next[targetIdx] = { ...next[targetIdx], syncState: 'idle' };
        return next;
      });
    } catch (e) {
      setFics(prev => {
        const next = [...prev];
        if (next[targetIdx] && next[targetIdx].id === ficId) {
          next[targetIdx] = { ...prevFic, syncState: 'error', syncError: e.message || String(e) };
        }
        return next;
      });
      if (e.isAuthError && onAuthError) onAuthError();
    }
  }, [accessToken]);

  const retrySync = useCallback((ficId) => {
    setFics(prev => {
      const idx = prev.findIndex(f => f.id === ficId);
      if (idx === -1) return prev;
      const fic = prev[idx];
      updateFic(ficId, { status: fic.status, dnr: fic.dnr, kg: fic.kg, bk: fic.bk });
      return prev;
    });
  }, [updateFic]);

  return { fics, status, errorMsg, lastSynced, refresh: fetchFics, updateFic, retrySync };
}

function computePercentileRanks(values) {
  const n = values.length;
  const sorted = values.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
  const ranks = new Array(n);
  let i = 0;
  while (i < n) {
    let j = i;
    while (j + 1 < n && sorted[j + 1][0] === sorted[i][0]) j++;
    const avgRank = (i + j) / 2;
    for (let k = i; k <= j; k++) ranks[sorted[k][1]] = avgRank;
    i = j + 1;
  }
  const denom = n > 1 ? n - 1 : 1;
  return ranks.map(r => (r / denom) * 100);
}

function useComputedScores(fics) {
  return useMemo(() => {
    if (fics.length === 0) return null;
    const n = fics.length;

    const status = fics.map(f => f.status);
    const dnr = fics.map(f => f.dnr);
    const kg = fics.map(f => f.kg);
    const bk = fics.map(f => f.bk);

    const khVals = fics.map(f => f.kudos / (f.hits + 1));
    const kchVals = fics.map(f => f.kudos / Math.max(1, f.chapters));
    const bmVals = fics.map(f => f.bookmarks);
    const coVals = fics.map(f => f.comments);
    const pctlKH = computePercentileRanks(khVals);
    const pctlKCH = computePercentileRanks(kchVals);
    const pctlBM = computePercentileRanks(bmVals);
    const pctlCO = computePercentileRanks(coVals);
    const qScore = new Array(n);
    for (let i = 0; i < n; i++) {
      qScore[i] = (pctlKH[i] * 1 + pctlKCH[i] * 1 + pctlBM[i] * 1.5 + pctlCO[i] * 1) / 4.5;
    }

    // Full vocabulary — every tag/category that appears, no top-N cap
    const tagStats = new Map(); // tag -> {readW, dnf, notInt}
    const catStats = new Map();

    function bump(map, key, field, amount) {
      if (!map.has(key)) map.set(key, { readW: 0, dnf: 0, notInt: 0 });
      map.get(key)[field] += amount;
    }

    for (let i = 0; i < n; i++) {
      const s = status[i], d = dnr[i], f = fics[i];
      if (s === STATUS_READ) {
        const w = 1 + 0.5 * (kg[i] ? 1 : 0) + 1 * (bk[i] ? 1 : 0);
        for (const t of f.tags) bump(tagStats, t, 'readW', w);
        bump(catStats, f.category, 'readW', w);
      } else if (s === STATUS_DNF) {
        if (d !== DNR_WRITING && d !== DNR_CONTENT_CAT) for (const t of f.tags) bump(tagStats, t, 'dnf', 1);
        if (d !== DNR_WRITING && d !== DNR_CONTENT_TAGS) bump(catStats, f.category, 'dnf', 1);
      } else if (s === STATUS_NOTINT) {
        if (d !== DNR_WRITING && d !== DNR_CONTENT_CAT) for (const t of f.tags) bump(tagStats, t, 'notInt', 1);
        if (d !== DNR_WRITING && d !== DNR_CONTENT_TAGS) bump(catStats, f.category, 'notInt', 1);
      }
    }

    function affinityOf(map, key, dnfWeight) {
      const s = map.get(key);
      if (!s) return { affinity: 0, totalRated: 0 };
      const totalRated = s.readW + s.dnf + s.notInt;
      const affinity = totalRated === 0 ? 0 : (s.readW - s.dnf * dnfWeight - s.notInt) / totalRated;
      return { affinity, totalRated };
    }

    const pScore = new Array(n);
    for (let i = 0; i < n; i++) {
      const f = fics[i];
      let tSum = 0, tCount = 0;
      for (const t of f.tags) {
        const { affinity, totalRated } = affinityOf(tagStats, t, 0.5);
        if (totalRated > 0) { tSum += affinity; tCount++; }
      }
      const ad = tCount > 0 ? tSum / tCount : 0;

      const { affinity: ae } = affinityOf(catStats, f.category, 0.5);
      pScore[i] = qScore[i] * (1 + 0.6 * ad) * (1 + 0.3 * Math.max(0, ae));
    }

    return { status, dnr, kg, bk, pScore };
  }, [fics]);
}

function Chip({ active, onClick, children, color }) {
  return (
    <button onClick={onClick} className="whitespace-nowrap rounded-full px-3 py-2 text-sm font-medium border shrink-0"
      style={{ backgroundColor: active ? (color || COLORS.ink) : COLORS.paperCard, color: active ? COLORS.paperCard : COLORS.ink, borderColor: active ? (color || COLORS.ink) : COLORS.line }}>
      {children}
    </button>
  );
}

function StatusPicker({ ficId, status, dnr, kg, bk, onUpdate }) {
  const [pendingStatus, setPendingStatus] = useState(null);
  const setStatus = (s) => {
    if (s === STATUS_READ) setPendingStatus(STATUS_READ);
    else if (s === STATUS_DNF || s === STATUS_NOTINT) setPendingStatus(s);
    else { onUpdate(ficId, { status: s, dnr: 0 }); setPendingStatus(null); }
  };
  const confirmRead = (kgVal, bkVal) => { onUpdate(ficId, { status: STATUS_READ, kg: kgVal, bk: bkVal }); setPendingStatus(null); };
  const confirmDnr = (reasonCode) => { onUpdate(ficId, { status: pendingStatus, dnr: reasonCode }); setPendingStatus(null); };

  return (
    <div className="mt-3">
      <div className="flex flex-wrap gap-1.5">
        {[STATUS_UNREAD, STATUS_READING, STATUS_READ, STATUS_DNF, STATUS_SKIPPED, STATUS_NOTINT].map(s => (
          <Chip key={s} active={status === s} onClick={() => setStatus(s)} color={STATUS_COLOR[s]}>{STATUS_LABELS[s]}</Chip>
        ))}
      </div>
      {pendingStatus === STATUS_READ && (
        <div className="mt-2 p-3 rounded-lg" style={{ backgroundColor: COLORS.paper }}>
          <p className="text-xs font-medium mb-2" style={{ color: COLORS.inkSoft }}>Left kudos? Bookmarked?</p>
          <div className="flex gap-2 flex-wrap">
            {[[false, false, 'Neither'], [true, false, 'Kudos'], [false, true, 'Bookmarked'], [true, true, 'Both']].map(([kv, bv, label]) => (
              <button key={label} onClick={() => confirmRead(kv, bv)} className="text-sm px-3 py-2 rounded-full border font-medium" style={{ borderColor: COLORS.line, backgroundColor: COLORS.paperCard, color: COLORS.ink }}>{label}</button>
            ))}
          </div>
        </div>
      )}
      {(pendingStatus === STATUS_DNF || pendingStatus === STATUS_NOTINT) && (
        <div className="mt-2 p-3 rounded-lg" style={{ backgroundColor: COLORS.paper }}>
          <p className="text-xs font-medium mb-2" style={{ color: COLORS.inkSoft }}>Why?</p>
          <div className="flex gap-2 flex-wrap">
            {[DNR_WRITING, DNR_CONTENT_TAGS, DNR_CONTENT_CAT, DNR_OTHER].map(code => (
              <button key={code} onClick={() => confirmDnr(code)} className="text-sm px-3 py-2 rounded-full border font-medium" style={{ borderColor: COLORS.line, backgroundColor: COLORS.paperCard, color: COLORS.ink }}>{DNR_LABELS[code]}</button>
            ))}
          </div>
        </div>
      )}
      {status !== STATUS_UNREAD && pendingStatus === null && (
        <p className="text-[11px] mt-1.5" style={{ color: COLORS.inkSoft }}>
          {status === STATUS_READ && `Kudos: ${kg ? 'Yes' : 'No'} · Bookmarked: ${bk ? 'Yes' : 'No'}`}
          {(status === STATUS_DNF || status === STATUS_NOTINT) && dnr > 0 && `Reason: ${DNR_LABELS[dnr]}`}
        </p>
      )}
    </div>
  );
}

function FicCard({ fic, scores, ficIndex, onUpdate, onRetry, expanded, onToggleExpand }) {
  const status = scores.status[ficIndex];
  const pScore = scores.pScore[ficIndex];
  const [tagsExpanded, setTagsExpanded] = useState(false);
  const [summaryExpanded, setSummaryExpanded] = useState(false);
  const TAG_PREVIEW = 6;
  const SUMMARY_PREVIEW_LEN = 220;
  const summaryIsLong = fic.summary && fic.summary.length > SUMMARY_PREVIEW_LEN;
  const summaryText = summaryExpanded || !summaryIsLong ? fic.summary : fic.summary.slice(0, SUMMARY_PREVIEW_LEN) + '…';

  return (
    <div className="rounded-md p-4 mb-3" style={{ backgroundColor: status === STATUS_READ ? '#F1F8F4' : COLORS.paperCard, border: `1px solid ${COLORS.line}`, borderLeft: `4px solid ${STATUS_COLOR[status]}` }}>
      <div className="flex items-center gap-2 mb-1.5">
        {status !== STATUS_UNREAD && (
          <span className="inline-block text-[10px] font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full" style={{ backgroundColor: STATUS_COLOR[status], color: '#FFFFFF' }}>{STATUS_LABELS[status]}</span>
        )}
        {fic.syncState === 'syncing' && (
          <span className="text-[10px]" style={{ color: COLORS.inkSoft }}>Saving to sheet…</span>
        )}
        {fic.syncState === 'error' && (
          <button onClick={() => onRetry(fic.id)} className="text-[10px] font-semibold underline" style={{ color: COLORS.maroon }}>
            Save failed — tap to retry
          </button>
        )}
      </div>
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0 flex-1">
          <h3 className="text-lg leading-snug" style={{ color: COLORS.ink, fontFamily: "'Lora', serif", fontWeight: 600 }}>{fic.title}</h3>
          <p className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>
            {fic.rating} · {fic.category} · {fic.words.toLocaleString()}w{fic.chapters > 1 ? ` · ${fic.chapters} ch` : ''} · {fic.date}
          </p>
        </div>
        <div className="shrink-0 text-right">
          <div className="text-lg font-bold" style={{ color: COLORS.maroon, fontFamily: "'Lora', serif" }}>{pScore.toFixed(0)}</div>
          <div className="text-[9px] uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>score</div>
        </div>
      </div>

      <div className="flex gap-3 mt-2 text-xs" style={{ color: COLORS.inkSoft }}>
        <span>♥ {fic.kudos.toLocaleString()}</span>
        <span>⚑ {fic.bookmarks.toLocaleString()}</span>
        <span>◉ {fic.hits.toLocaleString()}</span>
      </div>

      {fic.tags.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mt-2 items-center">
          {fic.tags.slice(0, tagsExpanded ? fic.tags.length : TAG_PREVIEW).map(t => (
            <span key={t} className="text-[11px] px-2 py-0.5 rounded" style={{ backgroundColor: COLORS.paper, color: COLORS.inkSoft }}>{t}</span>
          ))}
          {fic.tags.length > TAG_PREVIEW && (
            <button onClick={() => setTagsExpanded(v => !v)} className="text-[11px] px-2 py-0.5 font-medium" style={{ color: COLORS.maroon }}>
              {tagsExpanded ? 'Show less' : `+${fic.tags.length - TAG_PREVIEW} more`}
            </button>
          )}
        </div>
      )}

      {fic.summary && (
        <div className="mt-3">
          <p className="text-sm leading-snug" style={{ color: COLORS.inkSoft, fontFamily: "'Lora', serif" }}>{summaryText}</p>
          {summaryIsLong && (
            <button onClick={() => setSummaryExpanded(v => !v)} className="text-xs font-medium mt-1" style={{ color: COLORS.maroon }}>
              {summaryExpanded ? 'Show less' : 'Show more'}
            </button>
          )}
        </div>
      )}

      <div className="flex items-center justify-between mt-3">
        <a href={fic.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 text-sm font-medium py-2 px-1 -m-1" style={{ color: COLORS.maroon }}>
          Read on AO3 <ExternalLink size={14} />
        </a>
        <button onClick={() => onToggleExpand(fic.id)} className="p-2 -m-2" aria-label="Toggle status controls">
          {expanded ? <ChevronUp size={18} color={COLORS.inkSoft} /> : <ChevronDown size={18} color={COLORS.inkSoft} />}
        </button>
      </div>

      {expanded && (
        <StatusPicker ficId={fic.id} status={status} dnr={scores.dnr[ficIndex]} kg={scores.kg[ficIndex]} bk={scores.bk[ficIndex]} onUpdate={onUpdate} />
      )}
    </div>
  );
}

function SignInScreen({ onSignIn, gisReady, authError }) {
  return (
    <div className="h-screen w-full flex items-center justify-center p-6" style={{ backgroundColor: COLORS.paper, fontFamily: "'Inter', system-ui, sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');`}</style>
      <div className="max-w-sm w-full text-center">
        <h1 className="text-2xl mb-2" style={{ color: COLORS.ink, fontFamily: "'Lora', serif", fontWeight: 700 }}>Sign in to sync</h1>
        <p className="text-sm mb-4" style={{ color: COLORS.inkSoft }}>
          Sign in with the Google account that owns (or can edit) your Hollanov sheet. Marking a fic here will write straight back to it.
        </p>
        <button onClick={onSignIn} disabled={!gisReady} className="w-full py-2.5 rounded-full text-sm font-semibold" style={{ backgroundColor: COLORS.ink, color: COLORS.paperCard }}>
          {gisReady ? 'Sign in with Google' : 'Loading…'}
        </button>
        {authError && (<p className="text-xs mt-3" style={{ color: COLORS.maroon }}>{authError}</p>)}
        <p className="text-[11px] mt-4" style={{ color: COLORS.inkSoft }}>
          You may see an "unverified app" warning — that's expected for a personal project. Click Advanced → Go to (unsafe) to continue.
        </p>
      </div>
    </div>
  );
}

function toCSVField(v) {
  const s = String(v ?? '');
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function ExportPanel({ fics, onClose }) {
  const csvText = [
    'Title,Link,Status,DNR Reason,K,B',
    ...fics.map(f => [f.title, f.link, f.status ? STATUS_LABELS[f.status] : '', f.dnr ? DNR_LABELS[f.dnr] : '', f.kg ? 'Y' : '', f.bk ? 'Y' : ''].map(toCSVField).join(','))
  ].join('\n');

  const [copied, setCopied] = useState(false);
  const copyToClipboard = async () => {
    try { await navigator.clipboard.writeText(csvText); setCopied(true); setTimeout(() => setCopied(false), 2000); }
    catch (e) { /* ignore */ }
  };
  const downloadCSV = () => {
    const blob = new Blob([csvText], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hollanov-backup.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ backgroundColor: 'rgba(0,0,0,0.4)' }} onClick={onClose}>
      <div className="w-full sm:max-w-lg max-h-[80vh] rounded-t-2xl sm:rounded-2xl p-4 overflow-y-auto" style={{ backgroundColor: COLORS.paper }} onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-2">
          <h2 className="text-lg" style={{ color: COLORS.ink, fontFamily: "'Lora', serif", fontWeight: 700 }}>Backup current list</h2>
          <button onClick={onClose} className="p-2 -m-2"><X size={18} color={COLORS.inkSoft} /></button>
        </div>
        <p className="text-xs mb-3" style={{ color: COLORS.inkSoft }}>
          Since marks now write straight to your sheet, this is just a snapshot backup of everything as it currently stands — not something you need day-to-day.
        </p>
        <div className="flex gap-2 mb-3">
          <button onClick={copyToClipboard} className="flex-1 py-2.5 rounded-full text-sm font-semibold" style={{ backgroundColor: COLORS.ink, color: COLORS.paperCard }}>
            {copied ? 'Copied!' : 'Copy to clipboard'}
          </button>
          <button onClick={downloadCSV} className="flex items-center gap-1.5 px-4 py-2.5 rounded-full text-sm font-semibold border" style={{ borderColor: COLORS.line, color: COLORS.ink, backgroundColor: COLORS.paperCard }}>
            <Download size={14} /> CSV
          </button>
        </div>
      </div>
    </div>
  );
}

function HollanovRolladexLive() {
  const { accessToken, gisReady, signIn, signOut, authError } = useGoogleAuth();
  const { fics, status: syncStatus, errorMsg, lastSynced, refresh, updateFic, retrySync } = useSheetFics(accessToken, signOut);
  const scores = useComputedScores(fics);

  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState(new Set([STATUS_UNREAD]));
  const [ratingFilter, setRatingFilter] = useState(new Set());
  const [wordFilter, setWordFilter] = useState(new Set());
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [sortBy, setSortBy] = useState('score');
  const [expandedId, setExpandedId] = useState(null);
  const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);
  const [showSettings, setShowSettings] = useState(false);
  const [showExport, setShowExport] = useState(false);

  const ALL_RATINGS = useMemo(() => [...new Set(fics.map(f => f.rating).filter(Boolean))].sort(), [fics]);

  const toggleSetValue = (setFn, set, val) => {
    setFn(prev => { const next = new Set(prev); if (next.has(val)) next.delete(val); else next.add(val); return next; });
  };

  const filteredIndices = useMemo(() => {
    if (!scores) return [];
    const q = search.trim().toLowerCase();
    const indices = [];
    for (let i = 0; i < fics.length; i++) {
      const f = fics[i];
      if (statusFilter.size && !statusFilter.has(scores.status[i])) continue;
      if (ratingFilter.size && !ratingFilter.has(f.rating)) continue;
      if (wordFilter.size) {
        const inRange = [...wordFilter].some(bIdx => { const [, min, max] = WORD_BUCKETS[bIdx]; return f.words >= min && f.words < max; });
        if (!inRange) continue;
      }
      if (q) {
        const titleMatch = f.title.toLowerCase().includes(q);
        const tagMatch = f.tags.some(t => t.toLowerCase().includes(q));
        if (!titleMatch && !tagMatch) continue;
      }
      indices.push(i);
    }
    if (sortBy === 'score') indices.sort((a, b) => scores.pScore[b] - scores.pScore[a]);
    else if (sortBy === 'recent') indices.sort((a, b) => (fics[b].date || '').localeCompare(fics[a].date || ''));
    else if (sortBy === 'kudos') indices.sort((a, b) => fics[b].kudos - fics[a].kudos);
    return indices;
  }, [fics, scores, search, statusFilter, ratingFilter, wordFilter, sortBy]);

  useEffect(() => { setVisibleCount(PAGE_SIZE); }, [search, statusFilter, ratingFilter, wordFilter, sortBy]);

  if (!accessToken) return <SignInScreen onSignIn={signIn} gisReady={gisReady} authError={authError} />;

  const activeFilterCount = ratingFilter.size + wordFilter.size;
  const failedSyncCount = fics.filter(f => f.syncState === 'error').length;
  const syncingCount = fics.filter(f => f.syncState === 'syncing').length;
  const visible = filteredIndices.slice(0, visibleCount);

  return (
    <div className="h-screen w-full flex flex-col overflow-hidden" style={{ backgroundColor: COLORS.paper, fontFamily: "'Inter', system-ui, sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');`}</style>

      <div className="px-4 pt-4 pb-3 shrink-0" style={{ borderBottom: `2px solid ${COLORS.maroon}` }}>
        <div className="flex items-baseline justify-between">
          <h1 className="text-2xl tracking-tight" style={{ color: COLORS.ink, fontFamily: "'Lora', serif", fontWeight: 700 }}>Hollanov Fics List</h1>
          <div className="flex items-center gap-2">
            <span className="text-xs" style={{ color: COLORS.inkSoft }}>{filteredIndices.length} / {fics.length}</span>
            <button onClick={refresh} disabled={syncStatus === 'loading'} className="p-1.5 -m-1.5 rounded-full active:scale-95" aria-label="Refresh from sheet">
              <RefreshCw size={15} color={COLORS.inkSoft} style={syncStatus === 'loading' ? { animation: 'spin 1s linear infinite' } : {}} />
            </button>
          </div>
        </div>
        <div className="flex items-center justify-between mt-0.5 flex-wrap gap-x-3">
          <p className="text-[11px]" style={{ color: COLORS.inkSoft }}>
            {syncStatus === 'loading' && 'Syncing…'}
            {syncStatus === 'success' && lastSynced && `Synced ${lastSynced.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`}
            {syncStatus === 'error' && <span style={{ color: COLORS.maroon }}>Sync failed — showing last loaded data</span>}
          </p>
          <div className="flex items-center gap-3">
            <button onClick={() => setShowExport(true)} className="text-[11px] underline" style={{ color: COLORS.inkSoft }}>Backup list</button>
            <button onClick={() => setShowSettings(v => !v)} className="text-[11px] underline" style={{ color: COLORS.inkSoft }}>Account</button>
          </div>
        </div>

        {showSettings && (
          <div className="mt-2 p-3 rounded-lg text-xs" style={{ backgroundColor: COLORS.paperCard, border: `1px solid ${COLORS.line}` }}>
            <p className="mb-2" style={{ color: COLORS.inkSoft }}>Signed in and syncing to your Hollanov sheet.</p>
            <button onClick={signOut} className="font-medium" style={{ color: COLORS.maroon }}>Sign out</button>
          </div>
        )}
        {syncStatus === 'error' && (<div className="mt-2 p-2.5 rounded-lg text-xs" style={{ backgroundColor: '#FBEAEA', color: COLORS.maroon }}>{errorMsg}</div>)}
        {failedSyncCount > 0 && (
          <div className="mt-2 p-2.5 rounded-lg text-xs font-medium" style={{ backgroundColor: '#FBEAEA', color: COLORS.maroon }}>
            {failedSyncCount} fic{failedSyncCount === 1 ? '' : 's'} failed to save to your sheet — scroll down to find the red "tap to retry" note on each.
          </div>
        )}
        {syncingCount > 0 && failedSyncCount === 0 && (
          <div className="mt-2 p-2.5 rounded-lg text-xs" style={{ backgroundColor: COLORS.paperCard, border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}>
            Saving {syncingCount} change{syncingCount === 1 ? '' : 's'} to your sheet…
          </div>
        )}

        <div className="mt-3 flex items-center gap-2 rounded-full px-3 py-2.5" style={{ backgroundColor: COLORS.paperCard, border: `1px solid ${COLORS.line}` }}>
          <Search size={16} color={COLORS.inkSoft} />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search title or tag…" className="flex-1 bg-transparent outline-none text-sm" style={{ color: COLORS.ink }} />
          {search && (<button onClick={() => setSearch('')} aria-label="Clear search"><X size={16} color={COLORS.inkSoft} /></button>)}
        </div>

        <div className="mt-3 flex items-center gap-2 overflow-x-auto pb-1">
          <button onClick={() => setFiltersOpen(v => !v)} className="shrink-0 flex items-center gap-1.5 text-sm font-medium px-3 py-2 rounded-full"
            style={{ backgroundColor: filtersOpen ? COLORS.ink : COLORS.paperCard, color: filtersOpen ? COLORS.paperCard : COLORS.ink, border: `1px solid ${COLORS.line}` }}>
            <SlidersHorizontal size={14} /> Filters {activeFilterCount > 0 ? `(${activeFilterCount})` : ''}
          </button>
          {[STATUS_UNREAD, STATUS_READING, STATUS_READ, STATUS_DNF, STATUS_SKIPPED, STATUS_NOTINT].map(s => (
            <Chip key={s} active={statusFilter.has(s)} onClick={() => toggleSetValue(setStatusFilter, statusFilter, s)} color={STATUS_COLOR[s]}>{STATUS_LABELS[s]}</Chip>
          ))}
        </div>

        <div className="mt-2 flex items-center gap-2">
          <span className="text-xs" style={{ color: COLORS.inkSoft }}>Sort:</span>
          {[['score', 'Score'], ['recent', 'Newest'], ['kudos', 'Kudos']].map(([key, label]) => (
            <button key={key} onClick={() => setSortBy(key)} className="text-xs font-medium px-2.5 py-1 rounded-full" style={{ backgroundColor: sortBy === key ? COLORS.maroon : 'transparent', color: sortBy === key ? COLORS.paperCard : COLORS.inkSoft }}>{label}</button>
          ))}
        </div>

        {filtersOpen && (
          <div className="mt-3 space-y-3">
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-wide mb-1.5" style={{ color: COLORS.inkSoft }}>Rating</p>
              <div className="flex flex-wrap gap-1.5">{ALL_RATINGS.map(r => (<Chip key={r} active={ratingFilter.has(r)} onClick={() => toggleSetValue(setRatingFilter, ratingFilter, r)}>{r}</Chip>))}</div>
            </div>
            <div>
              <p className="text-[11px] font-semibold uppercase tracking-wide mb-1.5" style={{ color: COLORS.inkSoft }}>Word Count</p>
              <div className="flex flex-wrap gap-1.5">{WORD_BUCKETS.map(([label], i) => (<Chip key={label} active={wordFilter.has(i)} onClick={() => toggleSetValue(setWordFilter, wordFilter, i)}>{label}</Chip>))}</div>
            </div>
          </div>
        )}
      </div>

      <div className="flex-1 overflow-y-auto px-4 pt-3 pb-6">
        {syncStatus === 'loading' && fics.length === 0 && (<div className="text-center mt-16" style={{ color: COLORS.inkSoft }}><p className="text-sm">Loading your fic list…</p></div>)}
        {visible.length === 0 && syncStatus !== 'loading' && (<div className="text-center mt-16" style={{ color: COLORS.inkSoft }}><p className="text-sm">No fics match these filters.</p></div>)}
        {scores && visible.map(idx => (
          <FicCard key={fics[idx].id} fic={fics[idx]} ficIndex={idx} scores={scores} onUpdate={updateFic} onRetry={retrySync}
            expanded={expandedId === fics[idx].id} onToggleExpand={(id) => setExpandedId(prev => (prev === id ? null : id))} />
        ))}
        {visibleCount < filteredIndices.length && (
          <button onClick={() => setVisibleCount(v => v + PAGE_SIZE)} className="w-full py-3 rounded-full text-sm font-medium mt-2" style={{ backgroundColor: COLORS.paperCard, border: `1px solid ${COLORS.line}`, color: COLORS.maroon }}>
            Load more ({filteredIndices.length - visibleCount} remaining)
          </button>
        )}
      </div>

      {showExport && <ExportPanel fics={fics} onClose={() => setShowExport(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HollanovRolladexLive />);
</script>
</body>
</html>

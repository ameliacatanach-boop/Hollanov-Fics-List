  const cacheToken = (token, expiresInSeconds) => {
    const expiresAt = Date.now() + (Number(expiresInSeconds) || 3600) * 1000 - 60000; // 1 min safety margin
    try { localStorage.setItem(TOKEN_CACHE_KEY, JSON.stringify({ token, expiresAt })); } catch (e) {}
  };

  useEffect(() => {
    // On load, reuse a still-valid cached token instead of forcing a fresh sign-in
    try {
      const raw = localStorage.getItem(TOKEN_CACHE_KEY);
      if (raw) {
        const { token, expiresAt } = JSON.parse(raw);
        if (token && expiresAt && Date.now() < expiresAt) setAccessToken(token);
        else localStorage.removeItem(TOKEN_CACHE_KEY);
      }
    } catch (e) {}

    let cancelled = false;
    function init() {
      if (cancelled) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
        setTimeout(init, 200);
        return;
      }
      tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SHEETS_SCOPE,
        callback: (resp) => {
          if (resp.error) { setAuthError(resp.error_description || resp.error); return; }
          setAuthError('');
          setAccessToken(resp.access_token);
          cacheToken(resp.access_token, resp.expires_in);
        },
      });
      setGisReady(true);
    }
    init();
    return () => { cancelled = true; };
  }, []);

  const signIn = () => {
    setAuthError('');
    if (tokenClientRef.current) tokenClientRef.current.requestAccessToken();
  };
  const signOut = () => {
    if (accessToken && window.google) {
      window.google.accounts.oauth2.revoke(accessToken, () => {});
    }
    localStorage.removeItem(TOKEN_CACHE_KEY);
    setAccessToken(null);
  };

  return { accessToken, gisReady, signIn, signOut, authError };
}

function ficFromRow(headerIndex, row, rowNumber) {
  const get = (name) => { const i = headerIndex[name]; return i !== undefined ? (row[i] || '') : ''; };
  const title = get('Title').trim();
  if (!title) return null;
  const link = get('Link').trim();
  const tagsRaw = get('Tags').trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  const authorsRaw = get('Author').trim();
  const authors = authorsRaw ? authorsRaw.split(',').map(a => a.trim()).filter(Boolean) : [];
  const dnrTagsRaw = get('DNR Tags').trim();
  const dnrTags = dnrTagsRaw ? dnrTagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  const dnrCategory = get('DNR Category').trim().toUpperCase() === 'Y';
  const enjoymentRaw = parseInt(get('Enjoyment').trim(), 10);
  const enjoyment = (enjoymentRaw >= 1 && enjoymentRaw <= 5) ? enjoymentRaw : 0;
  const num = (v) => { const n = parseInt(String(v).replace(/,/g, ''), 10); return isNaN(n) ? 0 : n; };

  return {
    id: workIdFromLink(link, rowNumber),
    rowNumber,
    title, link,
    date: get('Date Published').trim(),
    rating: get('Rating (S)').trim(),
    category: get('Category').trim() || 'Uncategorized',
    words: num(get('Words')),
    chapters: num(get('Chapters')) || 1,
    comments: num(get('Comments')),
    kudos: num(get('Kudos')),
    bookmarks: num(get('Bookmarks')),
    hits: num(get('Hits')),
    tags,
    authors,
    summary: get('Summary').trim(),
    status: STATUS_CODE_MAP[get('Status').trim()] ?? 0,
    dnr: DNR_CODE_MAP[get('DNR Reason').trim()] ?? 0,
    dnrTags, dnrCategory,
    enjoyment,
    dateStarted: normIsoDate(get('Date Started')),
    dateRead: normIsoDate(get('Date Read')),
    lastRead: get('Last Read').trim(),
    chaptersRead: num(get('Chapters Read')),
    timesRead: num(get('Times Read')),
    kg: get('K').trim().toUpperCase() === 'Y',
    bk: get('B').trim().toUpperCase() === 'Y',
    recommended: get('Recommended').trim().toUpperCase() === 'Y',
    recSource: get('Rec Source').trim(),
    syncState: 'idle', // 'idle' | 'syncing' | 'error'
    syncError: '',
  };
}

function colLetter(index) {
  let s = '', i = index + 1;
  while (i > 0) {
    const rem = (i - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

function authFetchError(status, body) {
  const err = new Error(`HTTP ${status}: ${body.slice(0, 300)}`);
  if (status === 401) err.isAuthError = true;
  return err;
}

async function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } catch (e) {
    if (e.name === 'AbortError') {
      throw new Error('Request timed out — check your connection and try again.');
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function sheetsApiGet(accessToken) {
  const range = encodeURIComponent(`'${SHEET_TAB}'!A1:ZZ`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}`;
  const res = await fetchWithTimeout(url, { headers: { Authorization: `Bearer ${accessToken}` } }, 20000);
  if (!res.ok) {
    const body = await res.text();
    throw authFetchError(res.status, body);
  }
  const data = await res.json();
  return data.values || [];
}

async function sheetsApiWriteCell(accessToken, rowNumber, colLetterVal, value) {
  const range = encodeURIComponent(`'${SHEET_TAB}'!${colLetterVal}${rowNumber}`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?valueInputOption=USER_ENTERED`;
  const res = await fetchWithTimeout(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [[value]] }),
  }, 15000);
  if (!res.ok) {
    const errBody = await res.text();
    throw authFetchError(res.status, errBody);
  }
}

async function sheetsApiWriteStatus(accessToken, rowNumber, { status, dnr, kg, bk, dnrTags, dnrCategory, enjoyment }, dnrTagsCol, dnrCategoryCol, enjoymentCol) {
  const range = encodeURIComponent(`'${SHEET_TAB}'!B${rowNumber}:E${rowNumber}`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?valueInputOption=USER_ENTERED`;
  const statusLabel = status === STATUS_UNREAD ? '' : STATUS_LABELS[status];
  const dnrLabel = dnr ? DNR_LABELS[dnr] : '';
  const body = { values: [[statusLabel, dnrLabel, kg ? 'Y' : '', bk ? 'Y' : '']] };
  const res = await fetchWithTimeout(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }, 15000);
  if (!res.ok) {
    const errBody = await res.text();
    throw authFetchError(res.status, errBody);
  }

  if (dnrTagsCol) {
    await sheetsApiWriteCell(accessToken, rowNumber, dnrTagsCol, (dnrTags && dnrTags.length) ? dnrTags.join(', ') : '');
  }
  if (dnrCategoryCol) {
    await sheetsApiWriteCell(accessToken, rowNumber, dnrCategoryCol, dnrCategory ? 'Y' : '');
  }
  if (enjoymentCol) {
    await sheetsApiWriteCell(accessToken, rowNumber, enjoymentCol, ((status === STATUS_READ || status === STATUS_READING || status === STATUS_PAUSED) && enjoyment) ? String(enjoyment) : '');
  }
}

async function sheetsApiWriteRecommendation(accessToken, rowNumber, { recommended, recSource }, recCol, recSourceCol) {
  if (!recCol && !recSourceCol) {
    throw new Error('Could not find a "Recommended" or "Rec Source" column in your sheet — check the exact column header spelling (case-sensitive).');
  }
  if (recCol) await sheetsApiWriteCell(accessToken, rowNumber, recCol, recommended ? 'Y' : '');
  if (recSourceCol) await sheetsApiWriteCell(accessToken, rowNumber, recSourceCol, recommended ? (recSource || '') : '');
}

// <reading-feature>
// Reading-history tracking: dates, chapters, the append-only "Reading Log" tab.
// Everything here is plain JS (no React) so the logic can be tested on its own.
const READING_FIELD_KEYS = ['dateStarted', 'dateRead', 'lastRead', 'chaptersRead', 'timesRead'];
const READING_COL_NAMES = { dateStarted: 'Date Started', dateRead: 'Date Read', lastRead: 'Last Read', chaptersRead: 'Chapters Read', timesRead: 'Times Read' };
const STATUS_WRITE_KEYS = ['status', 'dnr', 'kg', 'bk', 'dnrTags', 'dnrCategory', 'enjoyment'];
const LOG_TAB = 'Reading Log';
const LOG_TZ = 'Australia/Melbourne';
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// "Today" and timestamps are always Melbourne time, whatever timezone the device is in.
function melbourneNow(d) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: LOG_TZ, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(d || new Date());
  const p = {};
  parts.forEach(x => { if (x.type !== 'literal') p[x.type] = x.value; });
  const date = `${p.year}-${p.month}-${p.day}`;
  return { date, stamp: `${date} ${p.hour}:${p.minute}` };
}

// Dates are written as plain-text ISO, but a cell someone typed by hand can come back in
// the sheet's display format — accept the common ones, and keep anything else as typed.
function normIsoDate(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s); // d/m/yyyy (Australian order)
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(s);
  if (m) {
    const mon = m[2][0].toUpperCase() + m[2].slice(1).toLowerCase();
    if (MONTH_MAP[mon] !== undefined) {
      let y = parseInt(m[3], 10);
      if (y < 100) y += 2000;
      return `${y}-${String(MONTH_MAP[mon] + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    }
  }
  return s;
}

function fmtShortDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return iso || '';
  const thisYear = melbourneNow().date.slice(0, 4);
  return `${parseInt(m[3], 10)} ${MONTH_NAMES[parseInt(m[2], 10) - 1]}${m[1] === thisYear ? '' : ' ' + m[1]}`;
}

function ordinal(n) {
  const v = n % 100;
  if (v >= 11 && v <= 13) return `${n}th`;
  return `${n}${({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th'}`;
}

// The dates line shown under the Kudos/Bookmarked/Enjoyment summary in the expanded card.
function readingDatesLine(status, f) {
  const parts = [];
  if (status === STATUS_READ) {
    if (f.dateStarted) parts.push(`Started ${fmtShortDate(f.dateStarted)}`);
    if (f.dateRead) parts.push(`Read ${fmtShortDate(f.dateRead)}`);
    if (f.timesRead >= 2) parts.push(`Read ${f.timesRead}×`);
  } else if (status === STATUS_READING || status === STATUS_PAUSED) {
    if (f.dateStarted) parts.push(`Started ${fmtShortDate(f.dateStarted)}`);
    if (f.timesRead >= 2) parts.push(`${ordinal(f.timesRead)} read`);
  } else if (status === STATUS_DNF) {
    if (f.dateStarted) parts.push(`Started ${fmtShortDate(f.dateStarted)}`);
  }
  return parts.join(' · ');
}

// Given a fic's state before a change and the patch being applied, work out which reading
// fields change as a side effect and which Reading Log events to append. Pure function.
// `now` = { date: 'YYYY-MM-DD', stamp: 'YYYY-MM-DD HH:MM' } in Melbourne time.
function computeReadingTransition(prev, patch, now) {
  const fields = {};
  const events = [];
  const isActive = (s) => s === STATUS_READING || s === STATUS_PAUSED;
  const readNo = (n) => n || 1;
  const from = prev.status;
  const to = patch.status === undefined ? from : patch.status;

  // No status change: a chapter-count update on an in-progress fic logs a Progress event
  // (the once-per-day cap is applied when the event is appended).
  if (to === from) {
    if (patch.chaptersRead !== undefined && isActive(from)) {
      events.push({ event: 'Progress', chaptersRead: patch.chaptersRead, readNumber: readNo(prev.timesRead) });
    }
    return { fields, events };
  }

  const chaptersNow = patch.chaptersRead !== undefined ? patch.chaptersRead : (prev.chaptersRead || 0);

  if (to === STATUS_READING) {
    if (from === STATUS_READ) { // Read again
      const n = (prev.timesRead || 1) + 1;
      Object.assign(fields, { timesRead: n, chaptersRead: 0, dateStarted: now.date, lastRead: now.stamp });
      events.push({ event: 'Re-read started', chaptersRead: 0, readNumber: n });
    } else if (from === STATUS_PAUSED) { // Resume
      fields.lastRead = now.stamp;
      events.push({ event: 'Progress', chaptersRead: chaptersNow, readNumber: readNo(prev.timesRead) });
    } else { // Start reading
      Object.assign(fields, { dateStarted: now.date, lastRead: now.stamp });
      events.push({ event: 'Started', chaptersRead: chaptersNow, readNumber: readNo(prev.timesRead) });
    }
  } else if (to === STATUS_PAUSED) {
    fields.lastRead = now.stamp;
    events.push({ event: 'Paused', chaptersRead: chaptersNow, readNumber: readNo(prev.timesRead) });
  } else if (to === STATUS_READ) {
    const times = prev.timesRead || 1;
    Object.assign(fields, { dateRead: now.date, lastRead: now.stamp, timesRead: times });
    // Finishing a fic that was in progress means everything published so far is read.
    if (isActive(from) && prev.chapters && chaptersNow < prev.chapters) fields.chaptersRead = prev.chapters;
    events.push({ event: 'Finished', chaptersRead: fields.chaptersRead !== undefined ? fields.chaptersRead : chaptersNow, readNumber: times });
  } else if (to === STATUS_DNF) {
    fields.lastRead = now.stamp;
    events.push({ event: 'DNF', chaptersRead: chaptersNow, readNumber: readNo(prev.timesRead) });
  }
  return { fields, events };
}

async function sheetsApiWriteReadingFields(accessToken, rowNumber, values, keys, cols) {
  const data = [];
  for (const k of keys) {
    const col = cols && cols[k];
    if (!col) continue; // column missing from the sheet: skip this field silently
    let v = values[k];
    if (v === undefined || v === null || (k === 'timesRead' && !v)) v = '';
    data.push({ range: `'${SHEET_TAB}'!${col}${rowNumber}`, values: [[v]] });
  }
  if (!data.length) return;
  // RAW so Sheets keeps dates/timestamps as the exact text written, never reinterpreting them.
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values:batchUpdate`;
  const res = await fetchWithTimeout(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ valueInputOption: 'RAW', data }),
  }, 15000);
  if (!res.ok) throw authFetchError(res.status, await res.text());
}

async function sheetsApiGetLog(accessToken) {
  const range = encodeURIComponent(`'${LOG_TAB}'!A:F`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}`;
  const res = await fetchWithTimeout(url, { headers: { Authorization: `Bearer ${accessToken}` } }, 20000);
  if (!res.ok) {
    const body = await res.text();
    if (res.status === 400 && /unable to parse range|not found/i.test(body)) return null; // tab missing
    throw authFetchError(res.status, body);
  }
  const data = await res.json();
  return data.values || [];
}

async function sheetsApiAppendLog(accessToken, rows) {
  const range = encodeURIComponent(`'${LOG_TAB}'!A:F`);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`;
  const res = await fetchWithTimeout(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: rows }),
  }, 15000);
  if (!res.ok) {
    const body = await res.text();
    const err = authFetchError(res.status, body);
    if (res.status === 400 && /unable to parse range|not found/i.test(body)) err.isLogTabMissing = true;
    throw err;
  }
}

// Append-only: this only ever adds rows. A missing "Reading Log" tab is skipped silently.
// Progress is logged at most once per fic per day (keyed on link + Melbourne date).
async function appendReadingEvents(ctx, fic, events, now) {
  if (!events.length || !ctx.log || ctx.log.available === false) return;
  const rows = [];
  const newKeys = [];
  for (const ev of events) {
    if (ev.event === 'Progress') {
      const key = `${fic.link}|${now.date}`;
      if (ctx.log.progressKeys.has(key) || newKeys.includes(key)) continue;
      newKeys.push(key);
    }
    rows.push([now.stamp, fic.link, fic.title, ev.event, ev.chaptersRead ?? '', ev.readNumber ?? '']);
  }
  if (!rows.length) return;
  try {
    await sheetsApiAppendLog(ctx.accessToken, rows);
  } catch (e) {
    if (e.isLogTabMissing) { ctx.log.available = false; return; }
    throw e;
  }
  newKeys.forEach(k => ctx.log.progressKeys.add(k));
}

// Everything that has to reach the sheet for one change, in order: the existing status
// columns, then the reading fields, then the Reading Log row(s).
async function persistFicChange(ctx, prevFic, patch, transition, now) {
  const merged = { ...prevFic, ...patch, ...transition.fields };
  const writeKeys = READING_FIELD_KEYS.filter(k => (k in patch) || (k in transition.fields));
  if (STATUS_WRITE_KEYS.some(k => k in patch)) {
    await sheetsApiWriteStatus(ctx.accessToken, merged.rowNumber, merged, ctx.dnrTagsCol, ctx.dnrCategoryCol, ctx.enjoymentCol);
  }
  if (writeKeys.length) {
    await sheetsApiWriteReadingFields(ctx.accessToken, merged.rowNumber, merged, writeKeys, ctx.readingCols);
  }
  await appendReadingEvents(ctx, merged, transition.events, now);
  return merged;
}
// </reading-feature>

function useSheetFics(accessToken, onAuthError) {
  const [fics, setFics] = useState([]);
  const [status, setStatus] = useState('idle');
  const [errorMsg, setErrorMsg] = useState('');
  const [lastSynced, setLastSynced] = useState(null);
  const ficsRef = useRef([]);
  const dnrTagsColRef = useRef(null);
  const dnrCategoryColRef = useRef(null);
  const enjoymentColRef = useRef(null);
  const recColRef = useRef(null);
  const recSourceColRef = useRef(null);
  const readingColsRef = useRef({});
  const logRef = useRef({ available: true, progressKeys: new Set() });
  const stepPendingRef = useRef({}); // ficId -> { chaptersRead, lastRead, timer } waiting on the tap debounce
  const updateFicRef = useRef(null);
  const [readingMissing, setReadingMissing] = useState([]);
  const [logMissing, setLogMissing] = useState(false);
  useEffect(() => { ficsRef.current = fics; }, [fics]);

  // Reads the Reading Log once per load so "one Progress row per fic per day" holds across
  // devices. A missing tab just turns logging off; any other failure is ignored here (the
  // append itself is what decides whether the tab exists).
  const loadReadingLog = async () => {
    logRef.current = { available: true, progressKeys: new Set() };
    try {
      const rows = await sheetsApiGetLog(accessToken);
      if (rows === null) { logRef.current.available = false; setLogMissing(true); return; }
      setLogMissing(false);
      rows.forEach(r => {
        if (r[3] === 'Progress') logRef.current.progressKeys.add(`${r[1]}|${String(r[0] || '').slice(0, 10)}`);
      });
    } catch (e) { /* ignore */ }
  };

  const fetchFics = useCallback(async () => {
    if (!accessToken) return;
    setStatus('loading');
    setErrorMsg('');
    try {
      const rows = await sheetsApiGet(accessToken);
      if (rows.length < 2) throw new Error('No data found in the "Data List" tab.');
      const header = rows[0];
      const headerIndex = {};
      header.forEach((h, i) => { headerIndex[h.trim()] = i; });
      dnrTagsColRef.current = headerIndex['DNR Tags'] !== undefined ? colLetter(headerIndex['DNR Tags']) : null;
      dnrCategoryColRef.current = headerIndex['DNR Category'] !== undefined ? colLetter(headerIndex['DNR Category']) : null;
      enjoymentColRef.current = headerIndex['Enjoyment'] !== undefined ? colLetter(headerIndex['Enjoyment']) : null;
      recColRef.current = headerIndex['Recommended'] !== undefined ? colLetter(headerIndex['Recommended']) : null;
      recSourceColRef.current = headerIndex['Rec Source'] !== undefined ? colLetter(headerIndex['Rec Source']) : null;
      const readingCols = {};
      const missing = [];
      READING_FIELD_KEYS.forEach(k => {
        const name = READING_COL_NAMES[k];
        readingCols[k] = headerIndex[name] !== undefined ? colLetter(headerIndex[name]) : null;
        if (readingCols[k] === null) missing.push(name);
      });
      readingColsRef.current = readingCols;
      setReadingMissing(missing);
      const parsedFics = [];
      for (let i = 1; i < rows.length; i++) {
        const fic = ficFromRow(headerIndex, rows[i], i + 1);
        if (fic) parsedFics.push(fic);
      }
      setFics(parsedFics);
      setLastSynced(new Date());
      setStatus('success');
      loadReadingLog();
    } catch (e) {
      setErrorMsg(e.message || String(e));
      setStatus('error');
      if (e.isAuthError && onAuthError) onAuthError();
    }
  }, [accessToken]);

  useEffect(() => { fetchFics(); }, [fetchFics]);

  const updateFic = useCallback(async (ficId, patchIn) => {
    // Read the current fic from a ref (kept in sync via useEffect) rather than as a
    // side effect inside a setState updater — updater functions must stay pure, since
    // React can invoke them more than once, which was silently corrupting this lookup.
    const prevFic = ficsRef.current.find(f => f.id === ficId);
    if (!prevFic) return;

    // Chapter taps still waiting on the debounce are saved together with this change.
    let patch = patchIn;
    const pend = stepPendingRef.current[ficId];
    if (pend) {
      clearTimeout(pend.timer);
      delete stepPendingRef.current[ficId];
      patch = { chaptersRead: pend.chaptersRead, lastRead: pend.lastRead, ...patchIn };
    }

    const now = melbourneNow();
    const transition = computeReadingTransition(prevFic, patch, now);

    setFics(prev => prev.map(f => f.id === ficId ? { ...f, ...patch, ...transition.fields, syncState: 'syncing', syncError: '', syncType: 'status', retryPatch: undefined } : f));

    try {
      const ctx = {
        accessToken,
        dnrTagsCol: dnrTagsColRef.current, dnrCategoryCol: dnrCategoryColRef.current, enjoymentCol: enjoymentColRef.current,
        readingCols: readingColsRef.current, log: logRef.current,
      };
      await persistFicChange(ctx, prevFic, patch, transition, now);
      if (logRef.current.available === false) setLogMissing(true);
      setFics(prev => prev.map(f => f.id === ficId ? { ...f, syncState: 'idle' } : f));
    } catch (e) {
      // retryPatch lets "tap to retry" re-apply the change that failed (the card itself rolls back).
      setFics(prev => prev.map(f => f.id === ficId ? { ...prevFic, syncState: 'error', syncError: e.message || String(e), syncType: 'status', retryPatch: patch } : f));
      if (e.isAuthError && onAuthError) onAuthError();
    }
  }, [accessToken]);
  useEffect(() => { updateFicRef.current = updateFic; }, [updateFic]);

  // +1 / -1 chapter. The count updates on screen straight away; the sheet write (and the
  // once-a-day Progress log row) happens after the taps settle, so rapid tapping is one save.
  const flushStep = (ficId) => {
    const p = stepPendingRef.current[ficId];
    if (!p) return;
    clearTimeout(p.timer);
    delete stepPendingRef.current[ficId];
    updateFicRef.current && updateFicRef.current(ficId, { chaptersRead: p.chaptersRead, lastRead: p.lastRead });
  };
  const stepChapters = useCallback((ficId, delta) => {
    const fic = ficsRef.current.find(f => f.id === ficId);
    if (!fic) return;
    const pend = stepPendingRef.current[ficId];
    const current = pend ? pend.chaptersRead : fic.chaptersRead;
    const next = Math.min(Math.max(fic.chapters, current), Math.max(0, current + delta));
    if (next === current) return;
    const stamp = melbourneNow().stamp;
    if (pend) clearTimeout(pend.timer);
    stepPendingRef.current[ficId] = { chaptersRead: next, lastRead: stamp, timer: setTimeout(() => flushStep(ficId), 700) };
    setFics(prev => prev.map(f => f.id === ficId ? { ...f, chaptersRead: next, lastRead: stamp } : f));
  }, []);
  useEffect(() => {
    const onHide = () => { if (document.visibilityState === 'hidden') Object.keys(stepPendingRef.current).forEach(flushStep); };
    document.addEventListener('visibilitychange', onHide);
    return () => document.removeEventListener('visibilitychange', onHide);
  }, []);

  const retrySync = useCallback((ficId) => {
    const fic = ficsRef.current.find(f => f.id === ficId);
    if (!fic) return;
    if (fic.syncType === 'recommendation') {
      updateRecommendation(ficId, { recommended: fic.recommended, recSource: fic.recSource });
    } else if (fic.retryPatch) {
      updateFic(ficId, fic.retryPatch);
    } else {
      updateFic(ficId, { status: fic.status, dnr: fic.dnr, kg: fic.kg, bk: fic.bk, dnrTags: fic.dnrTags, dnrCategory: fic.dnrCategory, enjoyment: fic.enjoyment });
    }
  }, [updateFic]);

  const updateRecommendation = useCallback(async (ficId, patch) => {
    const prevFic = ficsRef.current.find(f => f.id === ficId);
    if (!prevFic) return;

    setFics(prev => prev.map(f => f.id === ficId ? { ...f, ...patch, syncState: 'syncing', syncError: '', syncType: 'recommendation' } : f));

    try {
      const merged = { ...prevFic, ...patch };
      await sheetsApiWriteRecommendation(accessToken, merged.rowNumber, merged, recColRef.current, recSourceColRef.current);
      setFics(prev => prev.map(f => f.id === ficId ? { ...f, syncState: 'idle' } : f));
    } catch (e) {
      setFics(prev => prev.map(f => f.id === ficId ? { ...prevFic, syncState: 'error', syncError: e.message || String(e), syncType: 'recommendation' } : f));
      if (e.isAuthError && onAuthError) onAuthError();
    }
  }, [accessToken]);

  return { fics, status, errorMsg, lastSynced, refresh: fetchFics, updateFic, retrySync, updateRecommendation, stepChapters, readingMissing, logMissing };
}

function computePercentileRanks(values) {
  const n = values.length;
  const sorted = values.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]);
  const ranks = new Array(n);
  let i = 0;
  while (i < n) {
    let j = i;
    while (j + 1 < n && sorted[j + 1][0] === sorted[i][0]) j++;
    const avgRank = (i + j) / 2;
    for (let k = i; k <= j; k++) ranks[sorted[k][1]] = avgRank;
    i = j + 1;
  }
  const denom = n > 1 ? n - 1 : 1;
  return ranks.map(r => (r / denom) * 100);
}

const ANONYMOUS_AUTHORS = new Set(['anonymous', 'orphan_account', 'orphan account']);
function realAuthors(fic) { return fic.authors.filter(a => !ANONYMOUS_AUTHORS.has(a.trim().toLowerCase())); }

const MONTH_MAP = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
function parseFicDate(str) {
  if (!str) return 0;
  const s = str.trim();
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/.exec(s);
  if (m) {
    const day = parseInt(m[1], 10);
    const month = MONTH_MAP[m[2]];
    let year = parseInt(m[3], 10);
    if (year < 100) year += 2000;
    if (month === undefined) return 0;
    return new Date(year, month, day).getTime();
  }
  const t = Date.parse(s);
  return isNaN(t) ? 0 : t;
}

function useComputedScores(fics) {
  return useMemo(() => {
    if (fics.length === 0) return null;
    const n = fics.length;

    const status = fics.map(f => f.status);
    const dnr = fics.map(f => f.dnr);
    const kg = fics.map(f => f.kg);
    const bk = fics.map(f => f.bk);

    const khVals = fics.map(f => f.kudos / (f.hits + 1));
    const kchVals = fics.map(f => f.kudos / Math.max(1, f.chapters));
    const bmVals = fics.map(f => f.bookmarks);
    const coVals = fics.map(f => f.comments);
    const pctlKH = computePercentileRanks(khVals);
    const pctlKCH = computePercentileRanks(kchVals);
    const pctlBM = computePercentileRanks(bmVals);
    const pctlCO = computePercentileRanks(coVals);
    const qScore = new Array(n);
    for (let i = 0; i < n; i++) {
      qScore[i] = (pctlKH[i] * 1 + pctlKCH[i] * 1 + pctlBM[i] * 1.5 + pctlCO[i] * 1) / 4.5;
    }

    // Full vocabulary — every tag/category/author that appears, no top-N cap
    const tagStats = new Map(); // tag -> {readW, dnf, notInt}
    const catStats = new Map();
    const authorStats = new Map();

    function bump(map, key, field, amount) {
      if (!map.has(key)) map.set(key, { readW: 0, dnf: 0, notInt: 0 });
      map.get(key)[field] += amount;
    }

    // Given a fic and its DNF/Not Interested reason, work out which specific tags/
    // category should take the penalty. The unified "Content" reason only penalizes
    // whatever the user explicitly isolated; the legacy single-dimension reasons
    // (kept for fics marked before this was merged) fall back to blanket-penalizing
    // that whole dimension, exactly as they did before.
    function contentPenaltyTargets(f, d) {
      if (d === DNR_CONTENT) {
        return {
          tags: (f.dnrTags && f.dnrTags.length) ? f.dnrTags : [],
          category: !!f.dnrCategory,
        };
      }
      if (d === DNR_LEGACY_CONTENT_TAGS) return { tags: f.tags, category: false };
      if (d === DNR_LEGACY_CONTENT_CAT) return { tags: [], category: true };
      if (d === DNR_OTHER) return { tags: f.tags, category: true };
      return { tags: [], category: false }; // Writing/Pacing or unset: no content penalty
    }
    // Author affinity is protected from any "Content" reason (old or new) since that's
    // about tags/category, not the writing — but IS penalized by Writing/Pacing
    // and Other, matching the flipped logic used for tags.
    function authorExcluded(d) {
      return d === DNR_CONTENT || d === DNR_LEGACY_CONTENT_TAGS || d === DNR_LEGACY_CONTENT_CAT;
    }

    for (let i = 0; i < n; i++) {
      const s = status[i], d = dnr[i], f = fics[i];
      if (s === STATUS_READ) {
        const w = 1 + 0.5 * (kg[i] ? 1 : 0) + 1 * (bk[i] ? 1 : 0);
        for (const t of f.tags) bump(tagStats, t, 'readW', w);
        bump(catStats, f.category, 'readW', w);
        // Enjoyment (1-5, optional) only scales the author's signal — tags and
        // category keep using the plain kudos/bookmark weight regardless of rating.
        const authorW = w * (ENJOYMENT_MULTIPLIER[f.enjoyment] ?? 1);
        for (const a of realAuthors(f)) bump(authorStats, a, 'readW', authorW);
      } else if (s === STATUS_DNF) {
        const targets = contentPenaltyTargets(f, d);
        for (const t of targets.tags) bump(tagStats, t, 'dnf', 1);
        if (targets.category) bump(catStats, f.category, 'dnf', 1);
        if (!authorExcluded(d)) for (const a of realAuthors(f)) bump(authorStats, a, 'dnf', 1);
      } else if (s === STATUS_NOTINT) {
        const targets = contentPenaltyTargets(f, d);
        for (const t of targets.tags) bump(tagStats, t, 'notInt', 1);
        if (targets.category) bump(catStats, f.category, 'notInt', 1);
        if (!authorExcluded(d)) for (const a of realAuthors(f)) bump(authorStats, a, 'notInt', 1);
      }
    }

    function affinityOf(map, key, dnfWeight) {
      const s = map.get(key);
      if (!s) return { affinity: 0, totalRated: 0 };
      const totalRated = s.readW + s.dnf + s.notInt;
      const rawAffinity = totalRated === 0 ? 0 : (s.readW - s.dnf * dnfWeight - s.notInt) / totalRated;
      // Confidence shrinkage: a tag/ship/category/author with little evidence behind it
      // gets pulled toward neutral, so one early DNF can't swing it as hard as a
      // pattern backed by a dozen ratings. C=3 means ~1 rating -> 1/4 strength,
      // ~3 ratings -> half strength, approaching full strength as evidence grows.
      const C = 3;
      const confidence = totalRated / (totalRated + C);
      const affinity = rawAffinity * confidence;
      return { affinity, totalRated };
    }

    const pScore = new Array(n);
    for (let i = 0; i < n; i++) {
      const f = fics[i];

      // Fix 3: strength-weighted average — a tag you feel strongly about (positive
      // or negative) pulls harder than tags you're merely neutral on, instead of
      // every rated tag counting equally and averaging strong signals away.
      let tSum = 0, tWeight = 0, tCount = 0;
      for (const t of f.tags) {
        const { affinity, totalRated } = affinityOf(tagStats, t, 0.5);
        if (totalRated > 0) { tCount++; tSum += affinity * Math.abs(affinity); tWeight += Math.abs(affinity); }
      }
      const tagHasData = tCount > 0;
      const ad = tWeight > 0 ? tSum / tWeight : 0;

      const { affinity: aeRaw, totalRated: catTotalRated } = affinityOf(catStats, f.category, 0.5);
      const catHasData = catTotalRated > 0;
      const ae = Math.max(0, aeRaw);

      let auSum = 0, auWeight = 0, auCount = 0;
      for (const a of realAuthors(f)) {
        const { affinity, totalRated } = affinityOf(authorStats, a, 0.5);
        if (totalRated > 0) { auCount++; auSum += affinity * Math.abs(affinity); auWeight += Math.abs(affinity); }
      }
      const authorHasData = auCount > 0;
      const auRaw = auWeight > 0 ? auSum / auWeight : 0;
      const au = Math.max(0, auRaw);

      // Fix 2: combine the active dimensions into ONE weighted-average adjustment
      // instead of multiplying independent (1 + weight*affinity) factors together.
      // Multiplying let two negative signals compound harder than either alone
      // intended; averaging lets multiple signals blend instead.
      let weightSum = 0, adjSum = 0;
      if (tagHasData) { weightSum += 0.6; adjSum += 0.6 * ad; }
      if (catHasData) { weightSum += 0.3; adjSum += 0.3 * ae; }
      if (authorHasData) { weightSum += 0.9; adjSum += 0.9 * au; }
      const combinedAdjustment = weightSum > 0 ? adjSum / weightSum : 0;

      pScore[i] = qScore[i] * (1 + combinedAdjustment);
    }

    return { status, dnr, kg, bk, pScore, qScore };
  }, [fics]);
}

// Bottom sheet shell. Rendered into <body> so it floats above the list.
function Sheet({ label, onClose, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    if (ref.current) ref.current.focus();
    return () => { if (prev && prev.focus) prev.focus(); };
  }, []);
  return ReactDOM.createPortal(
    <div className="scrim" onClick={onClose}>
      <section role="dialog" aria-modal="true" aria-label={label} className="sheet" tabIndex={-1} ref={ref}
        onClick={e => e.stopPropagation()} onKeyDown={e => { if (e.key === 'Escape' && onClose) onClose(); }}>
        <div className="handle" aria-hidden="true"></div>
        {children}
      </section>
    </div>,
    document.body
  );
}

function StatusPill({ status, dnr }) {
  if (status === STATUS_UNREAD) return null;
  const reason = (status === STATUS_DNF || status === STATUS_NOTINT) && dnr ? DNR_LABELS[dnr] : '';
  let pill;
  if (status === STATUS_DNF) pill = <span className="pill" style={{ background: 'var(--inverse)', color: 'var(--on-inverse)' }}>DNF</span>;
  else if (status === STATUS_NOTINT) pill = <span className="pill" style={{ background: 'var(--text-secondary)', color: 'var(--surface)' }}>Not interested</span>;
  else if (status === STATUS_READ) pill = <span className="pill" style={{ background: 'var(--lime)', color: '#111111' }}><Check size={11} />Read</span>;
  else if (status === STATUS_READING) pill = <span className="pill" style={{ background: 'var(--blue)', color: '#FFFFFF' }}>Reading</span>;
  else if (status === STATUS_PAUSED) pill = <span className="pill" style={{ background: 'var(--grey-block)', color: 'var(--on-grey)' }}><PauseIcon size={10} />Paused</span>;
  else if (status === STATUS_TBR) pill = <span className="pill" style={{ background: 'var(--pink)', color: '#111111' }}>TBR</span>;
  else pill = <span className="pill" style={{ background: 'var(--grey-block)', color: 'var(--on-grey)' }}>{STATUS_LABELS[status]}</span>;
  return (<>{pill}{reason && <span className="t-meta" style={{ fontWeight: 700 }}>{reason}</span>}</>);
}

function Chip({ active, onClick, children, color, textColor }) {
  return (
    <button onClick={onClick} aria-pressed={!!active} className="chip"
      style={active ? { background: color || 'var(--inverse)', color: textColor || 'var(--on-inverse)' } : undefined}>
      {active && <Check size={14} />}{children}
    </button>
  );
}

// panelOnly + initialPending let the Currently-reading shelf open the very same Read / DNF
// flows (rating, kudos, bookmark, Content picker) without the status chips around them.
function StatusPicker({ ficId, status, dnr, dnrTags, dnrCategory, enjoyment, kg, bk, tags, category, onUpdate, reading, canAddDateRead, initialPending, panelOnly, onDone, onCancel, title, authors }) {
  const [pendingStatus, setPendingStatus] = useState(initialPending ?? null);
  const [addingDate, setAddingDate] = useState(false);
  const [dateVal, setDateVal] = useState('');
  const [pendingDnrCode, setPendingDnrCode] = useState(null);
  const [pickedDnrTags, setPickedDnrTags] = useState([]);
  const [pickedDnrCategory, setPickedDnrCategory] = useState(false);
  const [pendingRating, setPendingRating] = useState(initialPending === STATUS_READ ? (enjoyment || 0) : 0);

  const setStatus = (s) => {
    setPendingDnrCode(null);
    if (s === STATUS_READ) { setPendingRating(enjoyment || 0); setPendingStatus(STATUS_READ); }
    else if (s === STATUS_DNF || s === STATUS_NOTINT) setPendingStatus(s);
    else {
      const keepEnjoyment = s === STATUS_READING || s === STATUS_PAUSED;
      onUpdate(ficId, { status: s, dnr: 0, dnrTags: [], dnrCategory: false, ...(keepEnjoyment ? {} : { enjoyment: 0 }) });
      setPendingStatus(null);
    }
  };
  const toggleRating = (n) => setPendingRating(prev => prev === n ? 0 : n);
  const confirmRead = (kgVal, bkVal) => { onUpdate(ficId, { status: STATUS_READ, kg: kgVal, bk: bkVal, enjoyment: pendingRating }); setPendingStatus(null); onDone && onDone(); };
  const confirmDnr = (reasonCode) => {
    if (reasonCode === DNR_CONTENT) {
      setPendingDnrCode(reasonCode);
      setPickedDnrTags(dnrTags && dnrTags.length ? dnrTags : []);
      setPickedDnrCategory(!!dnrCategory);
    } else {
      onUpdate(ficId, { status: pendingStatus, dnr: reasonCode, dnrTags: [], dnrCategory: false });
      setPendingStatus(null);
      onDone && onDone();
    }
  };
  const toggleDnrTag = (t) => setPickedDnrTags(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);
  const anyPicked = pickedDnrTags.length > 0 || pickedDnrCategory;
  const confirmDnrContent = () => {
    onUpdate(ficId, { status: pendingStatus, dnr: DNR_CONTENT, dnrTags: pickedDnrTags, dnrCategory: pickedDnrCategory });
    setPendingStatus(null); setPendingDnrCode(null); setPickedDnrTags([]); setPickedDnrCategory(false);
    onDone && onDone();
  };

  // UI glue: closes the sheet without saving (same as the old inline panel's Cancel).
  const closeSheet = () => { if (panelOnly) { onCancel && onCancel(); } else { setPendingStatus(null); setPendingDnrCode(null); } };
  const byLine = authors && authors.length ? authors.join(', ') : '';
  const reasonStyle = (code) => (pendingDnrCode === code
    ? { background: 'var(--coral)', color: '#111111', fontWeight: 800 }
    : { background: 'var(--surface-sunken)', color: 'var(--text)' });
  const kbStyle = { Neither: { background: 'var(--surface-sunken)', color: 'var(--text)' }, Kudos: { background: 'var(--pink)', color: '#111111' },
    Bookmarked: { background: 'var(--lime)', color: '#111111' }, Both: { background: 'var(--inverse)', color: 'var(--on-inverse)' } };

  return (
    <div>
      {!panelOnly && (
        <div className="panel stack" style={{ gap: 10, marginTop: 4 }}>
          <div className="t-label">Status</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 8 }}>
            {[STATUS_UNREAD, STATUS_TBR, STATUS_READING, STATUS_PAUSED, STATUS_READ, STATUS_DNF, STATUS_SKIPPED, STATUS_NOTINT].map(s => {
              const on = status === s;
              return (
                <button key={s} onClick={() => setStatus(s)} aria-pressed={on} className="btn"
                  style={on ? { background: 'var(--inverse)', color: 'var(--on-inverse)' } : { background: 'var(--surface)', color: 'var(--text)' }}>
                  {on ? <Check size={14} /> : <span className="dot" style={{ background: STATUS_DOT[s] }} aria-hidden="true"></span>}
                  {STATUS_LABELS[s]}
                </button>
              );
            })}
          </div>
          {status !== STATUS_UNREAD && pendingStatus === null && (
            <p className="t-caption" style={{ margin: 0 }}>
              {status === STATUS_READ && `Kudos: ${kg ? 'Yes' : 'No'} · Bookmarked: ${bk ? 'Yes' : 'No'}${enjoyment ? ` · Enjoyment: ${enjoyment}/5` : ''}`}
              {(status === STATUS_DNF || status === STATUS_NOTINT) && dnr > 0 && (() => {
                if (dnr === DNR_CONTENT) {
                  const parts = [];
                  if (dnrTags && dnrTags.length) parts.push(`Tags: ${dnrTags.join(', ')}`);
                  if (dnrCategory) parts.push('Category');
                  return `Reason: Content${parts.length ? ` (${parts.join('; ')})` : ''}`;
                }
                if (dnr === DNR_LEGACY_CONTENT_TAGS) return `Reason: ${DNR_LABELS[dnr]}${dnrTags && dnrTags.length ? ` (${dnrTags.join(', ')})` : ''}`;
                return `Reason: ${DNR_LABELS[dnr]}`;
              })()}
            </p>
          )}
          {pendingStatus === null && readingDatesLine(status, reading || {}) && (
            <p className="t-caption" style={{ margin: 0 }}>{readingDatesLine(status, reading || {})}</p>
          )}
          {pendingStatus === null && status === STATUS_READ && !(reading && reading.dateRead) && canAddDateRead && (
            addingDate ? (
              <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>
                <input type="date" value={dateVal} max={melbourneNow().date} onChange={e => setDateVal(e.target.value)} aria-label="Date read"
                  style={{ minHeight: 44, border: 0, borderRadius: 999, padding: '0 14px', background: 'var(--surface)', color: 'var(--text)', fontSize: 14, fontWeight: 600 }} />
                <button disabled={!/^\d{4}-\d{2}-\d{2}$/.test(dateVal)}
                  onClick={() => { onUpdate(ficId, { dateRead: dateVal }); setAddingDate(false); setDateVal(''); }}
                  className="btn btn-primary">Save</button>
                <button onClick={() => { setAddingDate(false); setDateVal(''); }} className="btn btn-text">Cancel</button>
              </div>
            ) : (
              <div><button onClick={() => setAddingDate(true)} className="link">Add date read</button></div>
            )
          )}
        </div>
      )}

      {pendingStatus !== null && (
        <Sheet label={pendingStatus === STATUS_READ ? 'Mark as read' : 'Why are you marking this?'} onClose={closeSheet}>
          <div>
            <div className="t-meta" style={{ fontWeight: 700 }}>
              {pendingStatus === STATUS_READ ? 'Finished' : pendingStatus === STATUS_DNF ? 'Marking DNF' : 'Marking Not interested'}{byLine ? ` · ${byLine}` : ''}
            </div>
            <h2 className="t-sheet" style={{ marginTop: 2 }}>{pendingStatus === STATUS_READ ? <span className="hl">{title}</span> : title}</h2>
          </div>

          {pendingStatus === STATUS_READ && (
            <>

function RecommendToggle({ ficId, recommended, recSource, onUpdate }) {
  const [picking, setPicking] = useState(false);
  const toggle = () => {
    if (recommended) onUpdate(ficId, { recommended: false, recSource: '' });
    else setPicking(true);
  };
  const pick = (source) => {
    onUpdate(ficId, { recommended: true, recSource: source });
    setPicking(false);
  };
  return (
    <div>
      <button onClick={toggle} className="icon-btn" aria-label={recommended ? 'Remove recommendation mark' : 'Mark as recommended'}

function toCSVField(v) {
  const s = String(v ?? '');
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function ExportPanel({ fics, onClose }) {
  const csvText = [
    'Title,Link,Status,DNR Reason,K,B',
    ...fics.map(f => [f.title, f.link, f.status ? STATUS_LABELS[f.status] : '', f.dnr ? DNR_LABELS[f.dnr] : '', f.kg ? 'Y' : '', f.bk ? 'Y' : ''].map(toCSVField).join(','))
  ].join('\n');

  const [copied, setCopied] = useState(false);
  const copyToClipboard = async () => {
    try { await navigator.clipboard.writeText(csvText); setCopied(true); setTimeout(() => setCopied(false), 2000); }
    catch (e) { /* ignore */ }
  };
  const downloadCSV = () => {
    const blob = new Blob([csvText], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hollanov-backup.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <Sheet label="Backup current list" onClose={onClose}>
      <div className="row" style={{ justifyContent: 'space-between', gap: 8 }}>
        <h2 className="t-sheet">Backup current list</h2>
        <button onClick={onClose} className="icon-btn" aria-label="Close"><X size={18} /></button>
      </div>
      <p className="t-body">
        Since marks now write straight to your sheet, this is just a snapshot backup of everything as it currently stands — not something you need day-to-day.
      </p>
      <div className="row" style={{ gap: 8 }}>
        <button onClick={copyToClipboard} className="btn btn-primary btn-lg grow">
          {copied ? 'Copied!' : 'Copy to clipboard'}
        </button>
        <button onClick={downloadCSV} className="btn btn-secondary btn-lg">
          <Download size={16} /> CSV
        </button>
      </div>
    </Sheet>
  );
}

function HollanovRolladexLive() {
  const { accessToken, gisReady, signIn, signOut, authError } = useGoogleAuth();
  const { fics, status: syncStatus, errorMsg, lastSynced, refresh, updateFic, retrySync, updateRecommendation, stepChapters, readingMissing, logMissing } = useSheetFics(accessToken, signOut);
  const scores = useComputedScores(fics);

  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState(new Set([STATUS_UNREAD]));
  const [ratingFilter, setRatingFilter] = useState(new Set());
  const [wordFilter, setWordFilter] = useState(new Set());
  const [selectedTags, setSelectedTags] = useState([]);
  const [tagQuery, setTagQuery] = useState('');
  const [excludedTags, setExcludedTags] = useState([]);
  const [excludeTagQuery, setExcludeTagQuery] = useState('');
  const [recommendedOnly, setRecommendedOnly] = useState(false);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [sortBy, setSortBy] = useState('score');
  const [expandedId, setExpandedId] = useState(null);
  const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);
  const [showSettings, setShowSettings] = useState(false);
  const [showExport, setShowExport] = useState(false);

  const ALL_RATINGS = useMemo(() => [...new Set(fics.map(f => f.rating).filter(Boolean))].sort(), [fics]);
  const ALL_TAGS = useMemo(() => [...new Set(fics.flatMap(f => f.tags))], [fics]);
  const TAG_FREQUENCY = useMemo(() => {
    const m = new Map();
    fics.forEach(f => f.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
    return m;
  }, [fics]);
  const TAGS_BY_FREQUENCY = useMemo(() => [...ALL_TAGS].sort((a, b) => TAG_FREQUENCY.get(b) - TAG_FREQUENCY.get(a)), [ALL_TAGS, TAG_FREQUENCY]);

  const tagSuggestions = useMemo(() => {
    const q = tagQuery.trim().toLowerCase();
    const pool = q ? [...ALL_TAGS].sort() : TAGS_BY_FREQUENCY;
    return pool
      .filter(t => !selectedTags.includes(t) && !excludedTags.includes(t))
      .filter(t => !q || t.toLowerCase().includes(q))
      .slice(0, 5);
  }, [ALL_TAGS, TAGS_BY_FREQUENCY, tagQuery, selectedTags, excludedTags]);
  const addTag = (t) => { setSelectedTags(prev => [...prev, t]); setTagQuery(''); };
  const removeTag = (t) => setSelectedTags(prev => prev.filter(x => x !== t));

  const excludeTagSuggestions = useMemo(() => {
    const q = excludeTagQuery.trim().toLowerCase();
    const pool = q ? [...ALL_TAGS].sort() : TAGS_BY_FREQUENCY;
    return pool
      .filter(t => !selectedTags.includes(t) && !excludedTags.includes(t))
      .filter(t => !q || t.toLowerCase().includes(q))
      .slice(0, 5);
  }, [ALL_TAGS, TAGS_BY_FREQUENCY, excludeTagQuery, selectedTags, excludedTags]);
  const addExcludeTag = (t) => { setExcludedTags(prev => [...prev, t]); setExcludeTagQuery(''); };
  const removeExcludeTag = (t) => setExcludedTags(prev => prev.filter(x => x !== t));

  const toggleSetValue = (setFn, set, val) => {
    setFn(prev => { const next = new Set(prev); if (next.has(val)) next.delete(val); else next.add(val); return next; });
  };

  const filteredIndices = useMemo(() => {
    if (!scores) return [];
    const q = search.trim().toLowerCase();
    const indices = [];
    for (let i = 0; i < fics.length; i++) {
      const f = fics[i];
      if (statusFilter.size && !statusFilter.has(scores.status[i])) continue;
      if (ratingFilter.size && !ratingFilter.has(f.rating)) continue;
      if (wordFilter.size) {
        const inRange = [...wordFilter].some(bIdx => { const [, min, max] = WORD_BUCKETS[bIdx]; return f.words >= min && f.words < max; });
        if (!inRange) continue;
      }
      if (selectedTags.length && !selectedTags.every(t => f.tags.includes(t))) continue;
      if (excludedTags.length && excludedTags.some(t => f.tags.includes(t))) continue;
      if (recommendedOnly && !f.recommended) continue;
      if (q) {
        const titleMatch = f.title.toLowerCase().includes(q);
        const tagMatch = f.tags.some(t => t.toLowerCase().includes(q));
        const authorMatch = f.authors.some(a => a.toLowerCase().includes(q));
        if (!titleMatch && !tagMatch && !authorMatch) continue;
      }
      indices.push(i);
    }
    if (sortBy === 'score') indices.sort((a, b) => scores.pScore[b] - scores.pScore[a]);
    else if (sortBy === 'qscore') indices.sort((a, b) => scores.qScore[b] - scores.qScore[a]);
    else if (sortBy === 'recent') indices.sort((a, b) => parseFicDate(fics[b].date) - parseFicDate(fics[a].date));
    else if (sortBy === 'kudos') indices.sort((a, b) => fics[b].kudos - fics[a].kudos);
    return indices;
  }, [fics, scores, search, statusFilter, ratingFilter, wordFilter, selectedTags, excludedTags, recommendedOnly, sortBy]);

  useEffect(() => { setVisibleCount(PAGE_SIZE); }, [search, statusFilter, ratingFilter, wordFilter, sortBy]);

  // UI glue for the floating nav (layout only; no data or logic involved).
  const [navSection, setNavSection] = useState('fics');
  const goTo = (section) => {
    setNavSection(section);
    if (section === 'fics') window.scrollTo({ top: 0, behavior: 'smooth' });
    if (section === 'reading') { const el = document.getElementById('reading-shelf'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  };
  const activeNav = filtersOpen ? 'filters' : showSettings ? 'account' : navSection;
  const SORT_NOTE = { score: 'by score', qscore: 'by popularity', recent: 'newest first', kudos: 'by kudos' };

  if (!accessToken) return <SignInScreen onSignIn={signIn} gisReady={gisReady} authError={authError} />;

  const activeFilterCount = ratingFilter.size + wordFilter.size + selectedTags.length + excludedTags.length;
  const failedSyncCount = fics.filter(f => f.syncState === 'error').length;
  const syncingCount = fics.filter(f => f.syncState === 'syncing').length;
  const visible = filteredIndices.slice(0, visibleCount);

  return (
    <div className="app stack" style={{ gap: 18 }}>
      <header className="stack" style={{ gap: 12 }}>
        <div className="row" style={{ justifyContent: 'space-between', gap: 12 }}>
          <div className="stack" style={{ gap: 2, minWidth: 0 }}>
            <div className="t-fandom">{FANDOM_LINE}</div>
            <h1 className="t-app"><span className="hl">{APP_NAME}</span></h1>
          </div>
          <button onClick={refresh} disabled={syncStatus === 'loading'} className="icon-btn raised" aria-label="Refresh from sheet">
            <span style={{ display: 'inline-flex', animation: syncStatus === 'loading' ? 'spin 1s linear infinite' : 'none' }}><RefreshCw size={18} /></span>
          </button>
        </div>

        <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>
          <span className="count-pill num">{filteredIndices.length.toLocaleString()} of {fics.length.toLocaleString()}</span>
          <span className="t-meta">
            {syncStatus === 'loading' && 'Syncing…'}
            {syncStatus === 'success' && lastSynced && `Synced ${lastSynced.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`}
            {syncStatus === 'error' && <span style={{ color: 'var(--error-text)' }}>Sync failed — showing last loaded data</span>}
          </span>
        </div>

        {syncStatus === 'error' && (<div className="banner error" role="alert">{errorMsg}</div>)}
        {failedSyncCount > 0 && (
          <div className="banner error" role="alert" style={{ fontWeight: 700 }}>
            {failedSyncCount} fic{failedSyncCount === 1 ? '' : 's'} failed to save to your sheet — scroll down to find the red "tap to retry" note on each.
          </div>
        )}
        {(readingMissing.length > 0 || logMissing) && (
          <div className="banner warn">
            Reading tracker isn't fully set up, so some things aren't being saved:
            {readingMissing.length > 0 && <> no column named {readingMissing.map(c => `"${c}"`).join(', ')}.</>}
            {logMissing && <> no tab named "Reading Log".</>}
            {' '}Names must match exactly, including capitalisation and spacing.
          </div>
        )}
        {syncingCount > 0 && failedSyncCount === 0 && (
          <div className="banner info">
            Saving {syncingCount} change{syncingCount === 1 ? '' : 's'} to your sheet…
          </div>
        )}

        <label className="search">
          <Search size={18} />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search title, tag or author" aria-label="Search fics" />
          {search && (<button onClick={() => setSearch('')} className="icon-btn" style={{ background: 'transparent' }} aria-label="Clear search"><X size={16} /></button>)}
        </label>

        <div className="hscroll" role="group" aria-label="Status filters">
          <button onClick={() => setFiltersOpen(v => !v)} className="chip" aria-expanded={filtersOpen}
            style={{ background: 'var(--inverse)', color: 'var(--on-inverse)', fontWeight: 700, boxShadow: 'none' }}>
            <SlidersHorizontal size={16} /> Filters {activeFilterCount > 0 ? `(${activeFilterCount})` : ''}
          </button>
          {[STATUS_UNREAD, STATUS_TBR, STATUS_READING, STATUS_PAUSED, STATUS_READ, STATUS_DNF, STATUS_SKIPPED, STATUS_NOTINT].map(s => (
            <Chip key={s} active={statusFilter.has(s)} onClick={() => toggleSetValue(setStatusFilter, statusFilter, s)} color={STATUS_COLOR[s]} textColor={STATUS_ON[s]}>{STATUS_LABELS[s]}</Chip>
          ))}
          <Chip active={recommendedOnly} onClick={() => setRecommendedOnly(v => !v)}>Recommended</Chip>
        </div>

        <div className="seg" role="group" aria-label="Sort by">
          {[['score', 'Score'], ['qscore', 'Popularity'], ['recent', 'Newest'], ['kudos', 'Kudos']].map(([key, label]) => (
            <button key={key} onClick={() => setSortBy(key)} aria-pressed={sortBy === key}>{label}</button>
          ))}
        </div>
      </header>

      <CurrentlyReadingShelf fics={fics} onUpdate={updateFic} onStep={stepChapters} onRetry={retrySync} missingCols={readingMissing} />

      <main id="fic-list" className="stack" style={{ gap: 12 }}>
        <h2 className="t-section">Fics <span className="t-meta">· {SORT_NOTE[sortBy]}</span></h2>
        {syncStatus === 'loading' && fics.length === 0 && (
          <div className="card row" style={{ gap: 10, justifyContent: 'center', color: 'var(--text-secondary)' }}>
            <span style={{ display: 'inline-flex', color: 'var(--accent-text)', animation: 'spin 1s linear infinite' }}><RefreshCw size={18} /></span>
            <span className="t-meta">Loading your fic list…</span>
          </div>
        )}
        {visible.length === 0 && syncStatus !== 'loading' && (
          <div className="card" style={{ textAlign: 'center' }}><span className="t-meta">No fics match these filters.</span></div>
        )}
        {scores && visible.map(idx => (
          <FicCard key={fics[idx].id} fic={fics[idx]} ficIndex={idx} scores={scores} onUpdate={updateFic} onRetry={retrySync} onUpdateRecommendation={updateRecommendation} canAddDateRead={!readingMissing.includes('Date Read')}
            expanded={expandedId === fics[idx].id} onToggleExpand={(id) => setExpandedId(prev => (prev === id ? null : id))} />
        ))}
        {visibleCount < filteredIndices.length && (
          <button onClick={() => setVisibleCount(v => v + PAGE_SIZE)} className="btn btn-secondary btn-lg" style={{ width: '100%', background: 'var(--surface)', boxShadow: 'var(--shadow-control)' }}>
            Load more ({filteredIndices.length - visibleCount} remaining)
          </button>
        )}
      </main>

      {filtersOpen && (
        <Sheet label="Filters" onClose={() => setFiltersOpen(false)}>
          <div className="row" style={{ justifyContent: 'space-between' }}>
            <h2 className="t-sheet">Filters</h2>
            <button onClick={() => setFiltersOpen(false)} className="icon-btn" aria-label="Close filters"><X size={18} /></button>
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Rating</div>
            <div className="wrap" style={{ gap: 8 }}>{ALL_RATINGS.map(r => (<Chip key={r} active={ratingFilter.has(r)} onClick={() => toggleSetValue(setRatingFilter, ratingFilter, r)}>{r}</Chip>))}</div>
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Word count</div>
            <div className="wrap" style={{ gap: 8 }}>{WORD_BUCKETS.map(([label], i) => (<Chip key={label} active={wordFilter.has(i)} onClick={() => toggleSetValue(setWordFilter, wordFilter, i)}>{label}</Chip>))}</div>
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Include tags</div>
            {selectedTags.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {selectedTags.map(t => (
                  <span key={t} className="pill" style={{ background: 'var(--accent)', color: 'var(--on-accent)', fontSize: 13, fontWeight: 700, padding: '0 0 0 14px', minHeight: 44 }}>
                    {t}
                    <button onClick={() => removeTag(t)} aria-label={`Remove ${t} filter`} className="row" style={{ width: 44, height: 44, justifyContent: 'center' }}><X size={14} /></button>
                  </span>
                ))}
              </div>
            )}
            <label className="search sunken">
              <Search size={16} />
              <input value={tagQuery} onChange={e => setTagQuery(e.target.value)} placeholder={tagQuery ? 'Search tags…' : 'Top 5 shown — or search…'} aria-label="Search tags to include" />
            </label>
            {tagSuggestions.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {tagSuggestions.map(t => (
                  <button key={t} onClick={() => addTag(t)} className="pick" style={{ background: 'var(--surface-sunken)' }}>
                    {t} <span className="t-meta">({TAG_FREQUENCY.get(t)})</span>
                  </button>
                ))}
              </div>
            )}
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Exclude tags</div>
            {excludedTags.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {excludedTags.map(t => (
                  <span key={t} className="pill" style={{ background: 'var(--inverse)', color: 'var(--on-inverse)', fontSize: 13, fontWeight: 700, padding: '0 0 0 14px', minHeight: 44 }}>
                    <span style={{ textDecoration: 'line-through' }}>{t}</span>
                    <button onClick={() => removeExcludeTag(t)} aria-label={`Remove ${t} exclusion`} className="row" style={{ width: 44, height: 44, justifyContent: 'center' }}><X size={14} /></button>
                  </span>
                ))}
              </div>
            )}
            <label className="search sunken">
              <Search size={16} />
              <input value={excludeTagQuery} onChange={e => setExcludeTagQuery(e.target.value)} placeholder={excludeTagQuery ? 'Search tags…' : 'Top 5 shown — or search…'} aria-label="Search tags to exclude" />
            </label>
            {excludeTagSuggestions.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {excludeTagSuggestions.map(t => (
                  <button key={t} onClick={() => addExcludeTag(t)} className="pick" style={{ background: 'var(--surface-sunken)' }}>
                    {t} <span className="t-meta">({TAG_FREQUENCY.get(t)})</span>
                  </button>
                ))}
              </div>
            )}
          </div>
          <button onClick={() => setFiltersOpen(false)} className="btn btn-primary btn-xl">Show {filteredIndices.length.toLocaleString()} fics</button>
        </Sheet>
      )}

      {showSettings && (
        <Sheet label="Account" onClose={() => setShowSettings(false)}>
          <div className="row" style={{ justifyContent: 'space-between' }}>
            <h2 className="t-sheet">Account</h2>
            <button onClick={() => setShowSettings(false)} className="icon-btn" aria-label="Close account"><X size={18} /></button>
          </div>
          <p className="t-body">Signed in and syncing to your Hollanov sheet.</p>
          <button onClick={() => { setShowSettings(false); setShowExport(true); }} className="btn btn-secondary btn-lg"><Download size={16} /> Backup list</button>
          <button onClick={signOut} className="btn btn-text" style={{ color: 'var(--error-text)' }}>Sign out</button>
        </Sheet>
      )}

      {showExport && <ExportPanel fics={fics} onClose={() => setShowExport(false)} />}

      <nav className="nav" aria-label="Sections">
        <button onClick={() => goTo('fics')} aria-current={activeNav === 'fics' ? 'page' : undefined} aria-label="Fics"><ListIcon />{activeNav === 'fics' && 'Fics'}</button>
        <button onClick={() => goTo('reading')} aria-current={activeNav === 'reading' ? 'page' : undefined} aria-label="Reading"><BookIcon />{activeNav === 'reading' && 'Reading'}</button>
        <button onClick={() => setFiltersOpen(true)} aria-current={activeNav === 'filters' ? 'page' : undefined} aria-label="Filters"><SlidersHorizontal size={20} />{activeNav === 'filters' && 'Filters'}</button>
        <button onClick={() => setShowSettings(true)} aria-current={activeNav === 'account' ? 'page' : undefined} aria-label="Account"><UserIcon />{activeNav === 'account' && 'Account'}</button>
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HollanovRolladexLive />);
</script>
</body>
</html>
